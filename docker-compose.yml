services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # Exposed on host port 5435 to avoid collisions with default local PostgreSQL instances
      - "${POSTGRES_PORT_EXTERNAL:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ecommerce}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./ml:/code/ml
      - ./rag:/code/rag

volumes:
  pgdata:
